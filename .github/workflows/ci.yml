name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install -r requirements-dev.txt
      - run: ruff check
      - run: ruff format --check
      - run: pytest -q
